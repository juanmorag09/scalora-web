name: Deploy

# Publica en GitHub Pages cada cambio que llega a main, solo si la CI pasa.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un despliegue a la vez; el que está en curso termina antes de empezar el siguiente.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Leer la configuración de GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # SITE_URL y BASE_PATH salen de Pages; una variable del repositorio con el
      # mismo nombre las reemplaza (útil al pasar a un dominio propio).
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path }}
          PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
